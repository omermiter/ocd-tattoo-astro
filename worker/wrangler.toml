name = "ocd-tattoo-contact"
main = "src/index.ts"
compatibility_date = "2025-01-01"
workers_dev = true

# Kept specific (not "*") so other sites can't use this Resend relay/API key.
# Live domain went live 2026-09-02 — this now matches it. For local Worker
# testing against `npm run dev` (Astro on :4321), override with
# `wrangler dev --var ALLOWED_ORIGIN:http://localhost:4321` rather than
# editing this file, so production stays correct by default.
[vars]
ALLOWED_ORIGIN = "https://ocdtattoo.com"
