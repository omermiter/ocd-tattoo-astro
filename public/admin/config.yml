backend:
  name: github
  repo: omermiter/ocd-tattoo-astro
  branch: main
  base_url: https://ocd-tattoo-cms-auth.omer3107.workers.dev
  auth_endpoint: auth

# Anything dropped in through an image field that isn't inside a collection's
# own media_folder (below) lands here.
media_folder: "public/uploads"
public_folder: "/uploads"

collections:
  - name: "pieces"
    label: "Pieces"
    label_singular: "Piece"
    folder: "src/content/pieces"
    create: true
    delete: true
    slug: "{{fields.serial}}"
    format: "frontmatter"
    summary: "{{serial}} — {{title}}"
    fields:
      - { label: "Serial", name: "serial", widget: "string", hint: "e.g. OCD·03" }
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Placement", name: "placement", widget: "string" }
      - { label: "Size", name: "size", widget: "string", hint: "e.g. 9cm" }
      - { label: "Sessions", name: "sessions", widget: "number", value_type: "int", min: 1 }
      - { label: "Hours", name: "hours", widget: "number", min: 0 }
      - { label: "Date", name: "date", widget: "string", hint: "e.g. 2026.05" }
      - { label: "Note", name: "note", widget: "text", hint: "The artist's own words on this piece." }
      - label: "Photo"
        name: "photo"
        widget: "image"
        required: false
        media_folder: "/public/pieces"
        public_folder: "/pieces"
        hint: "Leave empty to show the 'Photography pending' placeholder."

  - name: "gallery"
    label: "More Work"
    label_singular: "Photo"
    folder: "src/content/gallery"
    create: true
    delete: true
    slug: "{{fields.title}}"
    format: "frontmatter"
    summary: "{{title}}"
    fields:
      - { label: "Title", name: "title", widget: "string", hint: "Short caption shown under the photo." }
      - label: "Photo"
        name: "photo"
        widget: "image"
        media_folder: "/public/gallery"
        public_folder: "/gallery"

  - name: "site"
    label: "Site Text & Settings"
    files:
      - name: "settings"
        label: "Site Settings"
        file: "src/data/site.json"
        fields:
          - label: "Contact"
            name: "contact"
            widget: "object"
            fields:
              - { label: "WhatsApp Number", name: "whatsappNumber", widget: "string", hint: "International format, digits only, no + (e.g. 972501234567)" }
              - { label: "Instagram Handle", name: "instagramHandle", widget: "string" }
              - { label: "Instagram URL", name: "instagramUrl", widget: "string" }
              - { label: "Location", name: "location", widget: "string" }
              - { label: "Studio Name", name: "studioName", widget: "string" }
              - { label: "Studio Address", name: "address", widget: "string" }
              - { label: "Google Maps / Reviews URL", name: "mapsUrl", widget: "string", hint: "The link visitors tap to see reviews / get directions. If you ever replace this, use the \"Share\" link from the Google Maps app/site (not a raw place-id URL) — some place-id link formats open fine on desktop but fail with \"can't find this place\" in the mobile Maps app." }
          - label: "Google Reviews (technical — leave as-is unless the Place ID changes)"
            name: "googleReviews"
            widget: "object"
            fields:
              - { label: "Google Place ID", name: "placeId", widget: "string", hint: "From Google Business Profile / Google Maps. Used at build time to pull live rating and reviews — see README." }
          - label: "Banner Image"
            name: "bannerImage"
            widget: "image"
            media_folder: "/public/uploads"
            public_folder: "/uploads"
            hint: "The full-bleed hero photo behind the headline. Shared by both languages. Also used as the video's poster frame and as the fallback for anyone who never gets the video (reduced-motion, data saver, slow connection)."
          - label: "Banner Video (optional)"
            name: "bannerVideo"
            widget: "file"
            media_folder: "/public/uploads"
            public_folder: "/uploads"
            required: false
            media_library:
              config:
                # Saving here commits the raw file straight to GitHub through
                # its API, which has a real, fairly low ceiling per file —
                # much lower than what an uncompressed clip needs. This stops
                # an oversized pick with a clear message immediately, instead
                # of a confusing failure after the fact. 8MB is comfortably
                # above what a short, muted, well-compressed loop needs.
                max_file_size: 8388608
            hint: "Must be an actual video file (.mp4) — not a photo. This field accepts any file type, so nothing stops you from picking an image by mistake; if you do, the site just quietly keeps showing the Banner Image instead (a browser can't play a photo as a video). Keep it under 8MB and a few seconds long — a short, muted, looping clip, not a full recording; anything bigger will fail to save (GitHub's upload API has a hard limit here). Vertical/portrait footage is fine — see Video Fit below for how it's shown. Leave empty to just show the Banner Image."
          - label: "Video Fit"
            name: "bannerVideoFit"
            widget: "select"
            default: "contain"
            options:
              - { label: "Smart fill — shows the whole video, nothing cropped (blurred fill on the sides)", value: "contain" }
              - { label: "Crop to fill — the video fills the banner edge to edge; choose what stays visible below", value: "cover" }
            hint: "Only matters if a Banner Video is set above."
          - label: "Video Position"
            name: "bannerVideoPosition"
            widget: "select"
            default: "center"
            options:
              - { label: "Center", value: "center" }
              - { label: "Top", value: "top" }
              - { label: "Bottom", value: "bottom" }
              - { label: "Left", value: "left" }
              - { label: "Right", value: "right" }
              - { label: "Top left", value: "top left" }
              - { label: "Top right", value: "top right" }
              - { label: "Bottom left", value: "bottom left" }
              - { label: "Bottom right", value: "bottom right" }
            hint: "With \"Crop to fill\": which part of the video stays on-screen once the sides are cropped away. With \"Smart fill\": nudges the uncropped video toward that side instead of centering it. No effect with no Banner Video set."
          - label: "Middle Banner Image"
            name: "middleBannerImage"
            widget: "image"
            media_folder: "/public/uploads"
            public_folder: "/uploads"
            hint: "The full-bleed photo further down the homepage, between Pieces and More Work — a separate image from the hero banner above (that one's controlled by Banner Image/Video higher up this page)."
          - label: "Feature Strip"
            name: "featureStrip"
            widget: "object"
            hint: "The 3-item row shown right under the intro paragraph."
            fields:
              - label: "English"
                name: "en"
                widget: "list"
                min: 3
                max: 3
                fields:
                  - { label: "Label", name: "label", widget: "string" }
                  - { label: "Detail", name: "detail", widget: "text" }
              - label: "Hebrew"
                name: "he"
                widget: "list"
                min: 3
                max: 3
                fields:
                  - { label: "Label", name: "label", widget: "string" }
                  - { label: "Detail", name: "detail", widget: "text" }
          - label: "Home & 404 Pages"
            name: "locales"
            widget: "object"
            fields:
              - label: "English"
                name: "en"
                widget: "object"
                fields:
                  - label: "Home Page"
                    name: "home"
                    widget: "object"
                    fields:
                      - { label: "Hero Eyebrow", name: "heroEyebrow", widget: "string" }
                      - { label: "Hero Title", name: "heroTitle", widget: "string", hint: "Wrap the emphasized word/phrase in *asterisks*." }
                      - { label: "Beat Text", name: "beatText", widget: "text" }
                      - { label: "Pieces Section Intro", name: "piecesIntro", widget: "text" }
                      - { label: "Gallery Section Intro", name: "galleryIntro", widget: "text" }
                      - { label: "Reviews Section Intro", name: "reviewsIntro", widget: "text" }
                      - { label: "Contact Intro", name: "contactIntro", widget: "text" }
                      - { label: "Closing Title", name: "closingTitle", widget: "string" }
                  - label: "404 Page"
                    name: "notFoundPage"
                    widget: "object"
                    fields:
                      - { label: "Code", name: "code", widget: "string", hint: "The small label above the heading — usually just \"404\"" }
                      - { label: "Heading", name: "heading", widget: "string" }
                      - { label: "Intro", name: "intro", widget: "text" }
              - label: "Hebrew"
                name: "he"
                widget: "object"
                fields:
                  - label: "Home Page"
                    name: "home"
                    widget: "object"
                    fields:
                      - { label: "Hero Eyebrow", name: "heroEyebrow", widget: "string" }
                      - { label: "Hero Title", name: "heroTitle", widget: "string", hint: "Wrap the emphasized word/phrase in *asterisks*." }
                      - { label: "Beat Text", name: "beatText", widget: "text" }
                      - { label: "Pieces Section Intro", name: "piecesIntro", widget: "text" }
                      - { label: "Gallery Section Intro", name: "galleryIntro", widget: "text" }
                      - { label: "Reviews Section Intro", name: "reviewsIntro", widget: "text" }
                      - { label: "Contact Intro", name: "contactIntro", widget: "text" }
                      - { label: "Closing Title", name: "closingTitle", widget: "string" }
                  - label: "404 Page"
                    name: "notFoundPage"
                    widget: "object"
                    fields:
                      - { label: "Code", name: "code", widget: "string" }
                      - { label: "Heading", name: "heading", widget: "string" }
                      - { label: "Intro", name: "intro", widget: "text" }
