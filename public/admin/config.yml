backend:
  name: github
  repo: omermiter/ocd-tattoo-astro
  branch: main
  base_url: https://ocd-tattoo-cms-auth.omer3107.workers.dev
  auth_endpoint: auth

# Anything dropped in through an image field that isn't inside a collection's
# own media_folder (below) lands here.
media_folder: "public/uploads"
public_folder: "/uploads"

collections:
  - name: "pieces"
    label: "Pieces"
    label_singular: "Piece"
    folder: "src/content/pieces"
    create: true
    delete: true
    slug: "{{fields.serial}}"
    format: "frontmatter"
    summary: "{{serial}} — {{title}}"
    fields:
      - { label: "Serial", name: "serial", widget: "string", hint: "e.g. OCD·03" }
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Placement", name: "placement", widget: "string" }
      - { label: "Size", name: "size", widget: "string", hint: "e.g. 9cm" }
      - { label: "Sessions", name: "sessions", widget: "number", value_type: "int", min: 1 }
      - { label: "Hours", name: "hours", widget: "number", min: 0 }
      - { label: "Date", name: "date", widget: "string", hint: "e.g. 2026.05" }
      - { label: "Note", name: "note", widget: "text", hint: "The artist's own words on this piece." }
      - label: "Photo"
        name: "photo"
        widget: "image"
        required: false
        media_folder: "/public/pieces"
        public_folder: "/pieces"
        hint: "Leave empty to show the 'Photography pending' placeholder."

  - name: "gallery"
    label: "More Work"
    label_singular: "Photo"
    folder: "src/content/gallery"
    create: true
    delete: true
    slug: "{{fields.title}}"
    format: "frontmatter"
    summary: "{{title}}"
    fields:
      - { label: "Title", name: "title", widget: "string", hint: "Short caption shown under the photo." }
      - label: "Photo"
        name: "photo"
        widget: "image"
        media_folder: "/public/gallery"
        public_folder: "/gallery"

  - name: "site"
    label: "Site Text & Settings"
    files:
      - name: "settings"
        label: "Site Settings"
        file: "src/data/site.json"
        fields:
          - label: "Contact"
            name: "contact"
            widget: "object"
            fields:
              - { label: "WhatsApp Number", name: "whatsappNumber", widget: "string", hint: "International format, digits only, no + (e.g. 972501234567)" }
              - { label: "Instagram Handle", name: "instagramHandle", widget: "string" }
              - { label: "Instagram URL", name: "instagramUrl", widget: "string" }
              - { label: "Location", name: "location", widget: "string" }
              - { label: "Studio Name", name: "studioName", widget: "string" }
              - { label: "Studio Address", name: "address", widget: "string" }
              - { label: "Google Maps / Reviews URL", name: "mapsUrl", widget: "string" }
          - label: "Google Reviews (technical — leave as-is unless the Place ID changes)"
            name: "googleReviews"
            widget: "object"
            fields:
              - { label: "Google Place ID", name: "placeId", widget: "string", hint: "From Google Business Profile / Google Maps. Used at build time to pull live rating and reviews — see README." }
          - label: "Banner Image"
            name: "bannerImage"
            widget: "image"
            media_folder: "/public/uploads"
            public_folder: "/uploads"
            hint: "The full-bleed hero photo behind the headline. Shared by both languages. Also used as the video's poster frame and as the fallback for anyone who never gets the video (reduced-motion, data saver, slow connection)."
          - label: "Banner Video (optional)"
            name: "bannerVideo"
            widget: "file"
            media_folder: "/public/uploads"
            public_folder: "/uploads"
            required: false
            hint: "MP4, muted, looping. Vertical/portrait footage is expected and handled automatically — it plays at full quality in the middle of the banner with a softly blurred version of itself filling the sides, so nothing gets cropped. Leave empty to just show the Banner Image."
          - label: "Feature Strip (English)"
            name: "featureStrip.en"
            widget: "list"
            hint: "The 3-item row shown right under the intro paragraph."
            min: 3
            max: 3
            fields:
              - { label: "Label", name: "label", widget: "string" }
              - { label: "Detail", name: "detail", widget: "text" }
          - label: "Feature Strip (Hebrew)"
            name: "featureStrip.he"
            widget: "list"
            min: 3
            max: 3
            fields:
              - { label: "Label", name: "label", widget: "string" }
              - { label: "Detail", name: "detail", widget: "text" }
          - label: "Home Page (English)"
            name: "locales.en.home"
            widget: "object"
            fields:
              - { label: "Hero Eyebrow", name: "heroEyebrow", widget: "string" }
              - { label: "Hero Title", name: "heroTitle", widget: "string", hint: "Wrap the emphasized word/phrase in *asterisks*." }
              - { label: "Beat Text", name: "beatText", widget: "text" }
              - { label: "Pieces Section Intro", name: "piecesIntro", widget: "text" }
              - { label: "Gallery Section Intro", name: "galleryIntro", widget: "text" }
              - { label: "Reviews Section Intro", name: "reviewsIntro", widget: "text" }
              - { label: "Contact Intro", name: "contactIntro", widget: "text" }
              - { label: "Closing Title", name: "closingTitle", widget: "string" }
          - label: "Home Page (Hebrew)"
            name: "locales.he.home"
            widget: "object"
            fields:
              - { label: "Hero Eyebrow", name: "heroEyebrow", widget: "string" }
              - { label: "Hero Title", name: "heroTitle", widget: "string", hint: "Wrap the emphasized word/phrase in *asterisks*." }
              - { label: "Beat Text", name: "beatText", widget: "text" }
              - { label: "Pieces Section Intro", name: "piecesIntro", widget: "text" }
              - { label: "Gallery Section Intro", name: "galleryIntro", widget: "text" }
              - { label: "Reviews Section Intro", name: "reviewsIntro", widget: "text" }
              - { label: "Contact Intro", name: "contactIntro", widget: "text" }
              - { label: "Closing Title", name: "closingTitle", widget: "string" }
          - label: "404 Page (English)"
            name: "locales.en.notFoundPage"
            widget: "object"
            fields:
              - { label: "Code", name: "code", widget: "string", hint: "The small label above the heading — usually just \"404\"" }
              - { label: "Heading", name: "heading", widget: "string" }
              - { label: "Intro", name: "intro", widget: "text" }
          - label: "404 Page (Hebrew)"
            name: "locales.he.notFoundPage"
            widget: "object"
            fields:
              - { label: "Code", name: "code", widget: "string" }
              - { label: "Heading", name: "heading", widget: "string" }
              - { label: "Intro", name: "intro", widget: "text" }
